[heuristic_postprocessing]
# Starting State of Charge for Electric Buses in %
soc_percentage = 80
# Power that a single bus can be charged at in W
# Actual power determined by buses power capability
chargingstation_power = 250000 
# Factor for total power available at all charging stations.
# Determines how fast multiple buses charge.
# (Should someday be individualised)
# Untested for values <1
total_power_factor = 4.0
# Seconds to pull eligible vehicles' spawn earlier than their latest
# possible depot-exit time
#leave unset to disable staggering
#offset = 200
# Seconds added to a bus's final depot arrival before it despawns.
# leave unset to disable
# Values close to zero might have unforseen outcomes when buses are delayed
#despawn_offset = 200
# Whether the depot charging stations are allowed to charge buses.
# Set to false to simulate depots without charging capability.
allow_depot_charging = true
# Factor for total power available at depot charging stations.
# Determines how many buses may charge at a depot simultaneously.
depot_total_power_factor = 10.0

[aggregate_battery]
# Seconds of an aggregation step
# Determines how strongly the battery output is compressed
interval = 60 

[energy_storage_system]
# Each station's ESS = ess_factor * that station's Peak Power (kWh)
ess_factor = 2.0
# uncomment to set a static capacity (Wh) for every station instead
# ess_capacity = 500000
# fraction (0.0-1.0) of each station's own ESS capacity
start_soc = 0.2
# scales the PV power generated by each station
pv_factor = 1.0
# always draw from grid below this fraction of SoC
grid_charge_max_soc = 0.2
# power (kW) drawn from grid while below grid_charge_max_soc
grid_charge_power = 50.0
# battery round-trip efficiency (0.0-1.0), e.g. ~0.95 for lithium-ion
efficiency = 0.95

[update_types]
# Constant auxiliary power draw (W) written to every vType's
# constantPowerIntake param in sumo/electric/e_type.add.xml
"Constant Power Intake" = 1000

[run_simulation_seeds]
# Space-separated list of seeds to run the simulation with, e.g. "161".
# A single "start:stop" token (no spaces) is also accepted as a range, e.g. "0:100".
# uncomment to run the simulation once per seed instead of a single run; leave unset to disable
seeds = "70 67 75 65 68"
# Number of simulation runs to perform in parallel
threads = 5